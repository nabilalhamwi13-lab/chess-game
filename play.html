<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>♟️ Mein Schach</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        min-height: 100vh;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #101820, #172a3a);
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .container {
        width: 100%;
        max-width: 900px;
        text-align: center;
    }

    h1 {
        font-size: 42px;
        margin-bottom: 8px;
    }

    .subtitle {
        color: #b8c7d9;
        margin-bottom: 20px;
    }

    .game-area {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        gap: 25px;
        flex-wrap: wrap;
    }

    #board {
        width: min(90vw, 560px);
        height: min(90vw, 560px);
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        grid-template-rows: repeat(8, 1fr);
        border: 5px solid #111;
        box-shadow: 0 15px 40px rgba(0,0,0,.45);
        border-radius: 6px;
        overflow: hidden;
    }

    .square {
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        position: relative;
        user-select: none;
    }

    .light {
        background: #f0d9b5;
    }

    .dark {
        background: #b58863;
    }

    .piece {
        font-size: clamp(34px, 7vw, 62px);
        line-height: 1;
        transition: transform .12s;
        z-index: 2;
    }

    .square:hover .piece {
        transform: scale(1.08);
    }

    .selected {
        box-shadow: inset 0 0 0 5px #00e5ff;
    }

    .possible {
        box-shadow: inset 0 0 0 5px rgba(0, 229, 255, .55);
    }

    .capture {
        box-shadow: inset 0 0 0 5px rgba(255, 80, 80, .8);
    }

    .panel {
        width: 260px;
        background: rgba(255,255,255,.08);
        border: 1px solid rgba(255,255,255,.15);
        border-radius: 15px;
        padding: 22px;
        backdrop-filter: blur(10px);
    }

    .turn {
        font-size: 22px;
        font-weight: bold;
        margin-bottom: 15px;
    }

    .status {
        min-height: 45px;
        color: #dce8f5;
        margin-bottom: 20px;
    }

    button {
        width: 100%;
        border: none;
        padding: 13px;
        margin-top: 10px;
        border-radius: 10px;
        background: #00bcd4;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: .2s;
    }

    button:hover {
        background: #00acc1;
        transform: translateY(-2px);
    }

    .moves-title {
        margin-top: 22px;
        margin-bottom: 10px;
        font-size: 18px;
    }

    #moves {
        max-height: 180px;
        overflow-y: auto;
        text-align: left;
        background: rgba(0,0,0,.2);
        border-radius: 8px;
        padding: 10px;
        font-size: 14px;
    }

    .move-row {
        padding: 5px 2px;
        border-bottom: 1px solid rgba(255,255,255,.08);
    }

    .hint {
        margin-top: 15px;
        font-size: 13px;
        color: #9fb3c8;
    }

    @media (max-width: 650px) {
        body {
            padding: 10px;
        }

        h1 {
            font-size: 32px;
        }

        .panel {
            width: min(90vw, 560px);
        }
    }
</style>
</head>

<body>

<div class="container">

    <h1>♟️ Mein Schach</h1>
    <div class="subtitle">Spiele Schach direkt im Browser</div>

    <div class="game-area">

        <div id="board"></div>

        <div class="panel">

            <div class="turn" id="turn">
                Weiß ist am Zug
            </div>

            <div class="status" id="status">
                Wähle eine Figur aus.
            </div>

            <button onclick="newGame()">
                🔄 Neues Spiel
            </button>

            <button onclick="flipBoard()">
                🔃 Brett drehen
            </button>

            <div class="moves-title">
                📜 Züge
            </div>

            <div id="moves">
                Noch keine Züge.
            </div>

            <div class="hint">
                Klicke zuerst eine Figur und anschließend auf ihr Zielfeld.
            </div>

        </div>

    </div>

</div>

<script>

const pieces = {

    white: {
        king: "♔",
        queen: "♕",
        rook: "♖",
        bishop: "♗",
        knight: "♘",
        pawn: "♙"
    },

    black: {
        king: "♚",
        queen: "♛",
        rook: "♜",
        bishop: "♝",
        knight: "♞",
        pawn: "♟"
    }

};

let board = [];
let selected = null;
let currentPlayer = "white";
let moveHistory = [];
let flipped = false;

const files = ["a","b","c","d","e","f","g","h"];

function createInitialBoard() {

    board = Array.from({length: 8}, () =>
        Array(8).fill(null)
    );

    const backRank = [
        "rook",
        "knight",
        "bishop",
        "queen",
        "king",
        "bishop",
        "knight",
        "rook"
    ];

    for (let c = 0; c < 8; c++) {

        board[0][c] = {
            color: "black",
            type: backRank[c]
        };

        board[1][c] = {
            color: "black",
            type: "pawn"
        };

        board[6][c] = {
            color: "white",
            type: "pawn"
        };

        board[7][c] = {
            color: "white",
            type: backRank[c]
        };
    }
}

function drawBoard() {

    const boardElement = document.getElementById("board");

    boardElement.innerHTML = "";

    for (let displayRow = 0; displayRow < 8; displayRow++) {

        for (let displayCol = 0; displayCol < 8; displayCol++) {

            const r = flipped ? 7 - displayRow : displayRow;
            const c = flipped ? 7 - displayCol : displayCol;

            const square = document.createElement("div");

            square.classList.add("square");

            if ((r + c) % 2 === 0) {
                square.classList.add("light");
            } else {
                square.classList.add("dark");
            }

            square.dataset.row = r;
            square.dataset.col = c;

            if (
                selected &&
                selected.row === r &&
                selected.col === c
            ) {
                square.classList.add("selected");
            }

            if (selected) {

                const legal = getLegalMoves(
                    selected.row,
                    selected.col
                );

                const isPossible = legal.some(
                    move => move.row === r && move.col === c
                );

                if (isPossible) {

                    if (board[r][c]) {
                        square.classList.add("capture");
                    } else {
                        square.classList.add("possible");
                    }
                }
            }

            const piece = board[r][c];

            if (piece) {

                const pieceElement =
                    document.createElement("span");

                pieceElement.className = "piece";

                pieceElement.textContent =
                    pieces[piece.color][piece.type];

                square.appendChild(pieceElement);
            }

            square.addEventListener(
                "click",
                () => handleSquareClick(r,c)
            );

            boardElement.appendChild(square);
        }
    }

    updateInterface();
}

function handleSquareClick(row,col) {

    if (isGameOver()) return;

    const piece = board[row][col];

    if (!selected) {

        if (
            piece &&
            piece.color === currentPlayer
        ) {

            selected = {row,col};
            drawBoard();
        }

        return;
    }

    const legalMoves = getLegalMoves(
        selected.row,
        selected.col
    );

    const isLegal = legalMoves.some(
        move =>
            move.row === row &&
            move.col === col
    );

    if (isLegal) {

        makeMove(
            selected.row,
            selected.col,
            row,
            col
        );

        selected = null;

        currentPlayer =
            currentPlayer === "white"
            ? "black"
            : "white";

        drawBoard();

        checkGameState();

    } else {

        if (
            piece &&
            piece.color === currentPlayer
        ) {

            selected = {row,col};

        } else {

            selected = null;
        }

        drawBoard();
    }
}

function makeMove(fromRow,fromCol,toRow,toCol) {

    const movingPiece =
        board[fromRow][fromCol];

    const capturedPiece =
        board[toRow][toCol];

    board[toRow][toCol] =
        movingPiece;

    board[fromRow][fromCol] =
        null;

    // Bauernumwandlung
    if (
        movingPiece.type === "pawn" &&
        (toRow === 0 || toRow === 7)
    ) {

        movingPiece.type = "queen";
    }

    const moveText =
        `${files[fromCol]}${8-fromRow} → ${files[toCol]}${8-toRow}`;

    moveHistory.push({
        text: moveText,
        capture: !!capturedPiece
    });

    updateMoves();
}

function getLegalMoves(row,col) {

    const piece = board[row][col];

    if (!piece) return [];

    let moves = [];

    if (piece.type === "pawn") {

        const direction =
            piece.color === "white" ? -1 : 1;

        const startRow =
            piece.color === "white" ? 6 : 1;

        const oneRow = row + direction;

        if (
            inside(oneRow,col) &&
            !board[oneRow][col]
        ) {

            moves.push({
                row: oneRow,
                col: col
            });

            const twoRow =
                row + direction * 2;

            if (
                row === startRow &&
                !board[twoRow][col]
            ) {

                moves.push({
                    row: twoRow,
                    col: col
                });
            }
        }

        for (const dc of [-1,1]) {

            const r = row + direction;
            const c = col + dc;

            if (
                inside(r,c) &&
                board[r][c] &&
                board[r][c].color !== piece.color
            ) {

                moves.push({
                    row:r,
                    col:c
                });
            }
        }

    }

    if (piece.type === "knight") {

        const jumps = [
            [-2,-1],[-2,1],
            [-1,-2],[-1,2],
            [1,-2],[1,2],
            [2,-1],[2,1]
        ];

        for (const [dr,dc] of jumps) {

            addIfValid(
                moves,
                row + dr,
                col + dc,
                piece.color
            );
        }
    }

    if (
        piece.type === "bishop" ||
        piece.type === "rook" ||
        piece.type === "queen"
    ) {

        let directions = [];

        if (
            piece.type === "bishop" ||
            piece.type === "queen"
        ) {

            directions.push(
                [-1,-1],
                [-1,1],
                [1,-1],
                [1,1]
            );
        }

        if (
            piece.type === "rook" ||
            piece.type === "queen"
        ) {

            directions.push(
                [-1,0],
                [1,0],
                [0,-1],
                [0,1]
            );
        }

        for (const [dr,dc] of directions) {

            let r = row + dr;
            let c = col + dc;

            while (inside(r,c)) {

                if (!board[r][c]) {

                    moves.push({row:r,col:c});

                } else {

                    if (
                        board[r][c].color !==
                        piece.color
                    ) {

                        moves.push({
                            row:r,
                            col:c
                        });
                    }

                    break;
                }

                r += dr;
                c += dc;
            }
        }
    }

    if (piece.type === "king") {

        for (let dr = -1; dr <= 1; dr++) {

            for (let dc = -1; dc <= 1; dc++) {

                if (dr === 0 && dc === 0)
                    continue;

                addIfValid(
                    moves,
                    row + dr,
                    col + dc,
                    piece.color
                );
            }
        }
    }

    return moves;
}

function addIfValid(moves,row,col,color) {

    if (!inside(row,col)) return;

    if (
        !board[row][col] ||
        board[row][col].color !== color
    ) {

        moves.push({row,col});
    }
}

function inside(row,col) {

    return (
        row >= 0 &&
        row < 8 &&
        col >= 0 &&
        col < 8
    );
}

function findKing(color) {

    for (let r=0;r<8;r++) {

        for (let c=0;c<8;c++) {

            if (
                board[r][c] &&
                board[r][c].type === "king" &&
                board[r][c].color === color
            ) {

                return {row:r,col:c};
            }
        }
    }

    return null;
}

function isGameOver() {

    return (
        !findKing("white") ||
        !findKing("black")
    );
}

function checkGameState() {

    const whiteKing =
        findKing("white");

    const blackKing =
        findKing("black");

    const status =
        document.getElementById("status");

    if (!whiteKing) {

        status.textContent =
            "♚ Schwarz gewinnt!";

        return;
    }

    if (!blackKing) {

        status.textContent =
            "♔ Weiß gewinnt!";

        return;
    }

    status.textContent =
        "Wähle eine Figur aus.";
}

function updateInterface() {

    document.getElementById("turn").textContent =
        currentPlayer === "white"
        ? "⚪ Weiß ist am Zug"
        : "⚫ Schwarz ist am Zug";
}

function updateMoves() {

    const movesElement =
        document.getElementById("moves");

    if (moveHistory.length === 0) {

        movesElement.textContent =
            "Noch keine Züge.";

        return;
    }

    movesElement.innerHTML = "";

    moveHistory.forEach(
        (move,index) => {

            const div =
                document.createElement("div");

            div.className = "move-row";

            const number =
                Math.floor(index / 2) + 1;

            const color =
                index % 2 === 0
                ? "Weiß"
                : "Schwarz";

            div.textContent =
                `${number}. ${color}: ${move.text}` +
                (move.capture ? " ×" : "");

            movesElement.appendChild(div);
        }
    );

    movesElement.scrollTop =
        movesElement.scrollHeight;
}

function newGame() {

    createInitialBoard();

    selected = null;

    currentPlayer = "white";

    moveHistory = [];

    document.getElementById("status").textContent =
        "Wähle eine Figur aus.";

    updateMoves();

    drawBoard();
}

function flipBoard() {

    flipped = !flipped;

    drawBoard();
}

newGame();

</script>

</body>
</html>
